<!doctype html>
<!-- frag-headless.html — rasterize a .frag to a transparent PNG via headless
     Chrome. scripts/frag-render.sh embeds the shader source into the
     #frag script tag and the target size + optional seed into #cfg as JSON,
     then reads back the rendered dataURL from the #out pre via --dump-dom. -->
<html>
<head><meta charset="utf-8"><style>
  body { margin: 0; background: transparent; }
  pre { color: #f66; background: #200; font: 12px monospace; white-space: pre-wrap; }
</style></head>
<body>
<script id="frag" type="x-shader">//FRAG_SRC_PLACEHOLDER//</script>
<script id="cfg" type="application/json">//CFG_PLACEHOLDER//</script>
<script id="out" type="text/plain"></script>
<script>
const SRC = document.getElementById("frag").textContent;
const CFG = JSON.parse(document.getElementById("cfg").textContent); // {w, h, seed}

function fail(msg) {
  document.getElementById("out").textContent = "RENDER_ERROR:" + msg;
  throw new Error(msg);
}

const canvas = document.createElement("canvas");
canvas.width = CFG.w;
canvas.height = CFG.h;

const gl = canvas.getContext("webgl2", {
  preserveDrawingBuffer: true,
  alpha: true,               // transparent background for compositing
  premultipliedAlpha: false, // straight alpha in the PNG
});
if (!gl) fail("no webgl2");

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    fail("shader:\n" + gl.getShaderInfoLog(s));
  return s;
}

try {
  const vs = compile(gl.VERTEX_SHADER, `#version 300 es
in vec2 pos;
void main() { gl_Position = vec4(pos, 0.0, 1.0); }`);
  const fs = compile(gl.FRAGMENT_SHADER, SRC);

  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    fail("link:\n" + gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3, 3, -1, 3, 3, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "pos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  gl.uniform2f(gl.getUniformLocation(prog, "u_resolution"), CFG.w, CFG.h);
  gl.uniform1f(gl.getUniformLocation(prog, "u_time"), 0.0);
  gl.uniform1f(gl.getUniformLocation(prog, "u_seed"), CFG.seed ?? 0.0);

  gl.viewport(0, 0, CFG.w, CFG.h);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  const dataUrl = canvas.toDataURL("image/png");
  document.getElementById("out").textContent = "DATAURL:" + dataUrl;
} catch (e) {
  fail(String(e && e.message || e));
}
</script>
</body>
</html>
