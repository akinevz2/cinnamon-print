<!doctype html>
<!-- project console — served at / (redirect) and /cloud by serve.mjs; streams
     step progress + artifact swaps over SSE from /cloud/events. -->
<html>
<head>
<meta charset="utf-8">
<title>cinnamon-print — project console</title>
<style>
  body { background:#000; color:#ccc; font-family:monospace; margin:0;
         display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px; }
  h3 { margin:0; font-weight:normal; letter-spacing:2px; color:#8af; }
  .bar { width:min(640px,80vw); height:16px; border:1px solid #345; background:#0a0a0a; }
  .fill { height:100%; width:0%; background:linear-gradient(90deg,#258,#8cf); transition:width .2s; }
  #status { color:#999; }
  img { max-width:92vw; max-height:74vh; border:1px solid #222; image-rendering:pixelated; }
  a { color:#68f; }
  /* collapsible left sidebar */
  #side { position:fixed; left:0; top:0; bottom:0; width:280px; background:#0b0f14;
          border-right:1px solid #234; padding:16px 12px; overflow-y:auto;
          transition:transform .25s; z-index:5; }
  #side.hidden { transform:translateX(-100%); }
  #side h4 { margin:0 0 10px; color:#8af; font-weight:normal; letter-spacing:2px; }
  #tab { position:fixed; left:0; top:0; z-index:6; background:#0b0f14; color:#8af;
         border:1px solid #234; border-left:none; padding:8px 10px; cursor:pointer; font-size:16px; }
  #plist { list-style:none; margin:0; padding:0; }
  #plist li { padding:8px 6px; border-bottom:1px solid #182028; cursor:pointer; }
  #plist li:hover { background:#101820; }
  #plist .t { color:#cde; }
  #plist .d { color:#567; font-size:11px; margin-top:3px; }
  #plist .dim { color:#456; cursor:default; }
  #plist .active { background:#12222e; }
  /* per-project mini progress bar inside each sidebar entry */
  #plist .mini { height:4px; background:#0a0a0a; border:1px solid #234; margin-top:5px; }
  #plist .mini i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#258,#8cf); transition:width .2s; }
  #plist .steps { color:#689; font-size:10px; margin-top:2px; }
  /* right-hand frag pane: overlay, 50% width, no layout shift */
  #fragpane { position:fixed; top:0; right:0; bottom:0; width:50vw;
              background:#0b0f14; border-left:1px solid #234; padding:16px 14px;
              overflow-y:auto; transform:translateX(100%); transition:transform .25s;
              z-index:8; }
  #fragpane.open { transform:translateX(0); }
  #fragpane h4 { margin:0 0 10px; color:#8af; font-weight:normal; letter-spacing:2px; }
  #fragtab { position:fixed; right:0; top:0; z-index:9; background:#0b0f14; color:#8af;
             border:1px solid #234; border-right:none; padding:8px 10px; cursor:pointer;
             font-size:16px; }
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:7; display:none; }
  #scrim.on { display:block; }
  #frag-status { color:#567; font-size:12px; margin-bottom:12px; }
  #frag-grid { display:flex; flex-wrap:wrap; gap:14px; }
  .fcard { width:calc(50% - 8px); min-width:200px; }
  .fcard .lbl { color:#8ac; font-size:11px; margin-bottom:4px; }
  .fcard .card { border:1px solid #1c2a36; background:#0a1016; padding:6px; }
  .fcard img { width:100%; display:block; cursor:grab; }
  .fcard a { display:inline-block; margin:6px 8px 0 0; color:#68f; font-size:12px;
             cursor:pointer; text-decoration:none; }
  .fcard .frag-error { color:#f88; background:#180b0b; border:1px solid #421; padding:8px;
                       font-size:11px; max-height:240px; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<button id="tab" title="projects">&#9776;</button>
<aside id="side">
  <h4>projects</h4>
  <ul id="plist"><li class="dim">loading…</li></ul>
</aside>
<h3>cinnamon-print — project console</h3>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="status">connecting…</div>
<img id="frame" hidden>
<a id="final" hidden target="_blank"></a>
<div id="scrim"></div>
<button id="fragtab" title="fragments — live">&#9638;</button>
<aside id="fragpane">
  <h4>fragments — live</h4>
  <div id="frag-status" class="dim">connecting…</div>
  <div id="frag-grid"></div>
</aside>
<script>
  const fill = document.getElementById("fill");
  const status = document.getElementById("status");
  const frame = document.getElementById("frame");
  const final = document.getElementById("final");

  function setFinalLink(file) {
    // The "open full-size" link must always point at the artefact currently
    // in the frame — not whatever last fired a build-completion event.
    if (!file) { final.hidden = true; return; }
    final.hidden = false;
    final.textContent = "open full-size " + file;
    final.href = "/output/" + file;
  }

  function onEvent(d) {
    if (d.progress) {
      fill.style.width = d.pct + "%";
      status.textContent = `step ${d.done}/${d.count} (${d.pct}%) — mode=${d.mode}`;
    }
    if (d.artifact) {
      frame.hidden = false;
      frame.src = "/output/" + d.artifact + "?v=" + Date.now();
      if (!/_\d+\.png$/.test(d.artifact)) {   // no step suffix -> final artefact
        status.textContent = "done — final artefact: " + d.artifact;
        setFinalLink(d.artifact);
      }
    }
  }

  // Collapsible project sidebar.
  const side = document.getElementById("side");
  const plist = document.getElementById("plist");
  let activeFile = null;
  const progressState = {};   // per-stem build progress: {step,total,pct,label}

  function miniBar(stem) {
    const p = progressState[stem];
    if (!p) return "";
    // an iterative build whose iteration window has lapsed is, in hindsight,
    // finished — don't freeze it mid-progress forever
    const stale = p.total > 1 && Date.now() - (p.time || 0) > 15 * 60 * 1000;
    if (stale) return `<div class="mini"><i style="width:100%"></i></div>` +
      `<div class="steps">${p.step - 1} re-renders · output ready</div>`;
    return `<div class="mini"><i style="width:${p.pct}%"></i></div>` +
           `<div class="steps">${p.step}/${p.total}${p.label ? " · " + p.label : ""}</div>`;
  }

  document.getElementById("tab").onclick = () => side.classList.toggle("hidden");
  side.classList.add("hidden"); // start collapsed

  function select(p, li) {
    activeFile = p.file;
    frame.hidden = false;
    frame.src = "/output/" + p.file + "?v=" + Date.now();
    status.textContent = "viewing " + p.title;
    setFinalLink(p.file);                    // link follows the frame
    side.classList.add("hidden");
    refreshProjects();                       // re-mark active
  }

  async function refreshProjects() {
    let projects = [];
    try { projects = await (await fetch("/api/projects")).json(); } catch {}
    if (!projects.length) {
      plist.innerHTML = '<li class="dim">no outputs yet</li>';
      return;
    }
    plist.innerHTML = "";
    for (const p of projects) {
      const li = document.createElement("li");
      if (p.file === activeFile) li.classList.add("active");
      const t = document.createElement("div"); t.className = "t"; t.textContent = p.title;
      const d = document.createElement("div"); d.className = "d";
      d.textContent = `${p.file}${p.updated ? " · " + new Date(p.updated).toLocaleString() : ""}`;
      if (p.prompt) d.title = p.prompt;         // prompt summary on hover
      li.append(t, d);
      li.onclick = () => select(p, li);
      li.insertAdjacentHTML("beforeend", miniBar(p.file.replace(/\.png$/i, "")));
      if (p.prompt) {
        const pr = document.createElement("div"); pr.className = "d";
        pr.textContent = p.prompt.length > 80 ? p.prompt.slice(0, 80) + "…" : p.prompt;
        li.appendChild(pr);
      }
      plist.appendChild(li);
    }
    // Open the latest worked-on project by default (the API returns
    // newest-first) instead of an empty frame.
    if (!activeFile && projects.length) select(projects[0], plist.firstChild);
  }
  refreshProjects();

  const es = new EventSource("/cloud/events");
  es.onmessage = (e) => {
    if (!e.data) return;
    const d = JSON.parse(e.data);
    if (d.stem && "step" in d && "total" in d) {
      // per-project build progress: update state, sidebar mini-bar, and the
      // main bar (which mirrors the active project's build)
      progressState[d.stem] = d;
      if (!activeFile || activeFile.replace(/\.png$/i, "") === d.stem) {
        fill.style.width = d.pct + "%";
        status.textContent = `building ${d.stem}: ${d.step}/${d.total}` + (d.label ? " — " + d.label : "");
      }
      refreshProjects();
      return;
    }
    if (d.projects) { refreshProjects(); return; }
    onEvent(d);
  };
  es.onopen = async () => {
    // restore per-stem progress state for the sidebars (page reloads)
    try {
      const map = await (await fetch("/api/progress")).json();
      for (const [stem, p] of Object.entries(map)) progressState[stem] = p;
      refreshProjects();
    } catch {}
    status.textContent = "waiting for build events…";
  };
</script>
<script type="module">
  // Right-hand frag pane: live shader swatches (same renderer as /frag),
  // opened via the top-right tab; overlay so the rest of the page never
  // reflows; dismissed by clicking outside its bounds.
  import { FragBench } from "/scripts/frag-scan.js";

  const pane = document.getElementById("fragpane");
  const scrim = document.getElementById("scrim");
  const tab = document.getElementById("fragtab");
  const grid = document.getElementById("frag-grid");
  const fstatus = document.getElementById("frag-status");
  const bench = new FragBench(512, 512);
  const cache = new Map(); // name -> { mtime, node }

  function openPane() {
    pane.classList.add("open");
    scrim.classList.add("on");
    refresh(); // render lazily on first open
  }
  function closePane() {
    pane.classList.remove("open");
    scrim.classList.remove("on");
  }
  tab.onclick = () => pane.classList.contains("open") ? closePane() : openPane();
  scrim.onclick = closePane;

  async function refresh() {
    let shaders = [];
    try { shaders = await (await fetch("/api/shaders")).json(); }
    catch { fstatus.textContent = "server unreachable"; return; }
    // Render the PRESENT-SET: reconcile the grid one-node-per-shader against
    // the authoritative list; a changed mtime replaces its card in place —
    // cache is keyed synchronously, so rapid events never duplicate entries.
    const seen = new Set();
    for (const { name, mtime } of shaders) {
      seen.add(name);
      const prev = cache.get(name);
      if (prev && prev.mtime === mtime && prev.node.isConnected) continue;
      if (prev) prev.node.remove();
      const node = document.createElement("div");
      node.className = "fcard";
      const label = document.createElement("div");
      label.className = "lbl";
      label.textContent = name + " · seed=" + bench.seedFrom(name).toFixed(2);
      const cardEl = document.createElement("div");
      cardEl.className = "card";
      cardEl.textContent = "rendering…";
      node.append(label, cardEl);
      cache.set(name, { mtime, node });
      grid.appendChild(node);
      (async () => {
        try {
          const src = await (await fetch("/resources/shaders/" + name)).text();
          const r = await bench.renderToImage(name, src);
          if (!node.isConnected) return; // superseded by a newer change
          cardEl.textContent = "";
          if (r.error) {
            const errBox = document.createElement("pre");
            errBox.className = "frag-error";
            errBox.textContent = `[${r.name}]\n${r.error}`;
            cardEl.append(errBox);
          } else {
            const save = document.createElement("a");
            save.href = r.dataUrl;
            save.download = r.name.replace(/\.frag$/, "") + ".png";
            save.textContent = "Save As";
            const post = document.createElement("a");
            post.textContent = "→ fragments";
            post.onclick = async () => {
              const res = await fetch("/api/fragments", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: r.name.replace(/\.frag$/, ""), dataUrl: r.dataUrl }),
              });
              post.textContent = res.ok ? "✓ dropped" : "✗ failed";
              setTimeout(() => (post.textContent = "→ fragments"), 1500);
            };
            cardEl.append(r.img, save, post);
          }
        } catch {
          if (node.isConnected) cardEl.textContent = "fetch failed";
        }
      })();
    }
    for (const [name, prev] of cache)
      if (!seen.has(name)) {
        prev.node.remove();
        cache.delete(name);
      }
    fstatus.textContent = `${shaders.length} shader(s) live — drag a swatch to your file manager`;
  }

  const fes = new EventSource("/cloud/events");
  fes.onmessage = (e) => {
    if (e.data) {
      const d = JSON.parse(e.data);
      if (d.shaders) refresh();
    }
  };
  fes.onopen = () => {
    fstatus.textContent = "shader updates will appear live";
  };
  fes.onerror = () => (fstatus.textContent = "event stream down — retrying");
</script>
</body>
</html>
